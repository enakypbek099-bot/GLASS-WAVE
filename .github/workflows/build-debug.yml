name: Build GLASS WAVE Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Android 14+ ARM64 Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          chmod +x gradlew

      - name: Download Google Oboe
        shell: bash
        run: |
          bash scripts/bootstrap_oboe.sh

      - name: Prepare build logs
        shell: bash
        run: |
          mkdir -p build-logs

      - name: Build GLASS WAVE Debug APK
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee build-logs/gradle-build.log

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build-logs

          echo "===== GLASS WAVE BUILD DIAGNOSTICS =====" \
            > build-logs/environment.txt

          echo "" >> build-logs/environment.txt
          echo "===== JAVA =====" >> build-logs/environment.txt
          java -version \
            >> build-logs/environment.txt 2>&1 || true

          echo "" >> build-logs/environment.txt
          echo "===== GRADLE =====" >> build-logs/environment.txt
          ./gradlew --version \
            >> build-logs/environment.txt 2>&1 || true

          echo "" >> build-logs/environment.txt
          echo "===== SDKMANAGER =====" >> build-logs/environment.txt
          sdkmanager --list_installed \
            >> build-logs/environment.txt 2>&1 || true

          echo "" >> build-logs/environment.txt
          echo "===== ANDROID SDK ROOT =====" \
            >> build-logs/environment.txt
          echo "${ANDROID_SDK_ROOT:-NOT_SET}" \
            >> build-logs/environment.txt

          echo "" >> build-logs/environment.txt
          echo "===== NDK =====" >> build-logs/environment.txt
          ls -la "${ANDROID_SDK_ROOT:-/dev/null}/ndk" \
            >> build-logs/environment.txt 2>&1 || true

          echo "" >> build-logs/environment.txt
          echo "===== CMAKE =====" >> build-logs/environment.txt
          ls -la "${ANDROID_SDK_ROOT:-/dev/null}/cmake" \
            >> build-logs/environment.txt 2>&1 || true

          echo "" >> build-logs/environment.txt
          echo "===== APK OUTPUT =====" \
            >> build-logs/environment.txt

          find app/build/outputs \
            -type f \
            -maxdepth 6 \
            -print \
            >> build-logs/environment.txt 2>&1 || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-wave-build-logs
          path: |
            build-logs/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glass-wave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

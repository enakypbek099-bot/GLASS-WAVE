name: Build GLASS WAVE Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Android 14+ ARM64 Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Generate Gradle Wrapper binary
        shell: bash
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin
          chmod +x gradlew

      - name: Download Google Oboe
        shell: bash
        run: bash scripts/bootstrap_oboe.sh

      - name: Build debug APK with logs
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee build-logs/gradle-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-wave-build-logs
          path: |
            build-logs/
            **/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glass-wave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
